name: Nix

on:
  pull_request:
    paths:
      - "flake.*"
      - "nix/**"
      - "pubspec.*"
      - "lib/**"
      - "assets/**"
      - "linux/**"
      - "packages/youtube_explode_dart/**"
      - ".github/workflows/nix.yml"
      - ".github/workflows/nix-maintenance.yml"
  push:
    branches: [main]
    paths:
      - "flake.*"
      - "nix/**"
      - "pubspec.*"
      - "lib/**"
      - "assets/**"
      - "linux/**"
      - "packages/youtube_explode_dart/**"
      - ".github/workflows/nix.yml"
      - ".github/workflows/nix-maintenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      - name: Check builds, formatting, workflows, and lockfile consistency
        run: nix flake check --print-build-logs
