plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    compileSdkVersion flutter.compileSdkVersion
    //ndkVersion flutter.ndkVersion
    ndkVersion = "26.3.11579264"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.anandnet.harmonymusic"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        def rawCode = flutterVersionCode.toInteger()
        versionCode rawCode < 4000 ? 4000 + rawCode : rawCode
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            def keyAliasVal = keystoreProperties['keyAlias'] ?: 'harmonymusic'
            def keyPasswordVal = keystoreProperties['keyPassword'] ?: 'HarmonyMusicPass2026'
            def storePasswordVal = keystoreProperties['storePassword'] ?: 'HarmonyMusicPass2026'
            def keystoreFile = file('upload-keystore.jks')

            if (keystorePropertiesFile.exists() && keystoreProperties['storeFile']) {
                def configuredFile = rootProject.file(keystoreProperties['storeFile'])
                if (!configuredFile.exists()) {
                    configuredFile = file(keystoreProperties['storeFile'])
                }
                if (!configuredFile.exists()) {
                    configuredFile = rootProject.file("app/${keystoreProperties['storeFile']}")
                }
                if (configuredFile.exists()) {
                    keystoreFile = configuredFile
                }
            }

            keyAlias keyAliasVal
            keyPassword keyPasswordVal
            storeFile keystoreFile
            storePassword storePasswordVal
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
    namespace 'com.anandnet.harmonymusic'

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.versionCodeOverride = defaultConfig.versionCode
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.android.support:multidex:2.0.1'
    implementation 'androidx.core:core-splashscreen:1.0.0-beta02'
}

